<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업 운영 보드 · 완성 예시</title>
<style>
:root{font-family:Inter,system-ui,'Malgun Gothic',sans-serif;color:#253630;background:#f7f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button,.button{border:1px solid #cbd6ce;background:white;color:#284d40;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#edf2ec}button:disabled{opacity:.4;cursor:default}button.primary{background:#284d40;color:white;border-color:#284d40}button.danger{color:#a03f32}a{color:#284d40}header{max-width:1200px;margin:auto;padding:32px 24px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:26px;margin:8px 0}h2{font-size:21px}h3{margin:0;font-size:17px}.eyebrow{font-size:12px;letter-spacing:.1em;color:#637a6c}.intro,.toolbar,.layout{max-width:1200px;margin:auto;padding:0 24px}.intro{line-height:1.7;color:#607168}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px auto}.layout{display:grid;grid-template-columns:265px 1fr;gap:24px;padding-bottom:64px}.panel,.activity{background:#fff;border:1px solid #dce2da;border-radius:12px;padding:20px}.lesson{display:block;text-align:left;width:100%;margin:8px 0;padding:14px}.lesson.active{background:#e7eee5;border-color:#75947d}.lesson small{display:block;margin-top:7px;color:#647366}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}label{display:block;font-size:13px;color:#596e5f;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #cbd6ce;border-radius:8px;padding:10px;background:#fff;color:#253630}textarea{resize:vertical;min-height:70px}.activity{margin-top:14px;background:#fcfcfa}.fields{display:grid;grid-template-columns:90px 1fr;gap:12px}.muted{font-size:13px;color:#63756b;line-height:1.6}.notice{max-width:1152px;margin:16px auto;background:#fff0d7;padding:12px 18px;border-radius:9px;white-space:pre-wrap}.saved{min-height:22px;color:#526b5a;font-size:13px}#presentation{max-width:1100px;margin:20px auto;padding:24px}.stage{background:#fff;border:1px solid #dce2da;border-radius:20px;padding:clamp(24px,6vw,72px);margin:24px 0;text-align:center}.stage h2{font-size:clamp(28px,5vw,58px);margin:25px 0}.stage p{font-size:clamp(20px,3vw,30px);line-height:1.6;white-space:pre-wrap}.timer{font-size:clamp(50px,10vw,96px);font-variant-numeric:tabular-nums;margin:22px}.center{justify-content:center}[hidden]{display:none!important}:focus-visible{outline:3px solid #b28c3b;outline-offset:3px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.toolbar{gap:6px}.panel{padding:16px}.fields{grid-template-columns:75px 1fr}}
</style></head><body>
<header><div><span class="eyebrow">완성 예시 · 수업 운영 보드</span><h1>수업의 흐름을 한눈에.</h1></div><a class="button" href="./2026-09-20-guide.html#/lesson/codex">← 가이드로 돌아가기</a></header>
<p class="intro">이 브라우저에 저장됩니다. 실제 학생 개인정보를 입력하지 마세요.<br>백업으로 다른 기기에 옮길 수 있어요.</p><div id="notice" class="notice" role="alert" hidden></div>
<div id="editor"><div class="toolbar"><button class="primary" id="newLesson">+ 새 수업</button><button id="backup">백업 다운로드</button><button id="restore">백업 불러오기</button><input hidden type="file" id="file" accept=".json,application/json"><span class="saved" id="saved" role="status"></span></div><div class="layout"><aside class="panel"><h2>나의 수업</h2><p class="muted">수업을 선택해서 준비하세요.</p><div id="lessons"></div></aside><main class="panel" id="detail"></main></div></div>
<section id="presentation" hidden aria-label="수업 진행 화면"><div class="row spread"><button id="leave">← 준비 화면</button><strong id="presentLesson"></strong><span id="counter"></span></div><div class="stage"><span class="eyebrow">지금 함께 할 활동</span><h2 id="presentTitle"></h2><p id="presentDescription"></p><a id="presentLink" target="_blank" rel="noopener noreferrer" class="button" hidden>활동 자료 열기 ↗</a><div class="timer" id="timer" aria-label="남은 시간">00:00</div><div class="row center"><button id="toggleTimer" class="primary">타이머 시작</button><button id="resetTimer">시간 초기화</button></div><p class="muted" id="nextHint"></p></div><div class="row spread"><button id="previous">← 이전 활동</button><button class="primary" id="next">다음 활동 →</button></div></section>
<script>
'use strict';
const KEY='gssam-classroom-board-v1';
const $=id=>document.getElementById(id);
const initial={version:1,lessons:[{title:'3학년 과학 · 자석의 성질',subject:'공개수업 · 가상 예시',activities:[{title:'도입 · 자석과 만나기',description:'자석에 붙을 것 같은 물건을 예상하고, 그렇게 생각한 이유를 이야기해 봅시다.',minutes:5,url:''},{title:'탐구 · 자석의 성질 알아보기',description:'여러 물건을 자석 가까이 가져가 관찰해 봅시다. 자석끼리 가까이하면 어떻게 되는지도 탐구하고 발견한 점을 나누어 봅시다.',minutes:25,url:''},{title:'정리 · 발견한 성질 나누기',description:'오늘 발견한 자석의 성질을 정리하고, 우리 생활에서 자석을 사용하는 예를 찾아봅시다.',minutes:10,url:''}]}]};
let state=structuredClone(initial),selected=0,current=0,remaining=0,endAt=0,tick=null;
function notify(message){$('notice').textContent=message;$('notice').hidden=!message;}
function safeUrl(value){if(!value)return true;try{return ['https:','http:'].includes(new URL(value).protocol);}catch{return false;}}
function validate(data){if(!data||data.version!==1||!Array.isArray(data.lessons)||!data.lessons.length||data.lessons.length>100)throw Error('수업은 1~100개여야 합니다.');return {version:1,lessons:data.lessons.map(l=>{if(!l||typeof l.title!=='string'||!l.title.trim()||l.title.length>150||typeof l.subject!=='string'||l.subject.length>150||!Array.isArray(l.activities)||l.activities.length>100)throw Error('수업 정보 형식이 올바르지 않습니다.');return{title:l.title,subject:l.subject,activities:l.activities.map(a=>{if(!a||typeof a.title!=='string'||a.title.length>150||typeof a.description!=='string'||a.description.length>4000||!Number.isInteger(a.minutes)||a.minutes<1||a.minutes>180||typeof a.url!=='string'||a.url.length>2000||!safeUrl(a.url))throw Error('활동 정보 또는 자료 링크가 올바르지 않습니다.');return{title:a.title,description:a.description,minutes:a.minutes,url:a.url};})};})};}
let storageBlocked=false;
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch{storageBlocked=true;notify('저장된 자료를 읽을 수 없습니다. 원본을 보호하기 위해 자동 저장을 중지했습니다. 현재 화면은 예시입니다. 백업 불러오기로 복구하거나, 백업 다운로드로 현재 작업을 보관하세요.');}
function save(){if(storageBlocked){$('saved').textContent='자동 저장 중지 · 백업을 사용하세요';return;}try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='이 브라우저에 저장됨';}catch{$('saved').textContent='저장 실패';notify('브라우저에 저장하지 못했습니다. 화면의 작업은 유지됩니다. 창을 닫기 전에 백업 다운로드를 해 주세요.');}}
function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
function button(text,fn,cls){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b;}
function field(parent,labelText,value,change,type='text',max=150){const id='f-'+Math.random().toString(36).slice(2);const label=el('label',labelText);label.htmlFor=id;const input=el(type==='textarea'?'textarea':'input');input.id=id;if(type!=='textarea')input.type=type;input.value=value;input.maxLength=max;input.addEventListener('change',()=>change(input));parent.append(label,input);return input;}
function syncLessonCaption(){const card=$('lessons').children[selected],l=state.lessons[selected];if(card){card.querySelector('strong').textContent=l.title;card.querySelector('small').textContent=l.subject+' · '+l.activities.length+'개 활동';}}
function render(){const list=$('lessons');list.replaceChildren();state.lessons.forEach((l,i)=>{const b=button('',()=>{selected=i;render();},'lesson'+(i===selected?' active':''));b.append(el('strong',l.title),el('small',l.subject+' · '+l.activities.length+'개 활동'));b.setAttribute('aria-pressed',String(i===selected));list.append(b);});const l=state.lessons[selected],d=$('detail');d.replaceChildren();const heading=el('div',undefined,'row spread');heading.append(el('h2','수업 준비'),button('수업 시작 →',start,'primary'));d.append(heading);field(d,'수업 이름',l.title,input=>{if(!input.value.trim()){input.value=l.title;return;}l.title=input.value.trim();save();syncLessonCaption();});field(d,'과목 / 메모',l.subject,input=>{l.subject=input.value;save();syncLessonCaption();});const actions=el('div',undefined,'row');actions.style.marginTop='16px';actions.append(button('수업 복제',()=>{if(state.lessons.length>=100)return notify('수업은 최대 100개입니다.');const copy=structuredClone(l);copy.title=(copy.title+' (복사)').slice(0,150);state.lessons.push(copy);selected=state.lessons.length-1;save();render();}),button('수업 삭제',()=>{if(!confirm('이 수업을 삭제할까요? 삭제 후 되돌릴 수 없습니다.'))return;state.lessons.splice(selected,1);if(!state.lessons.length)state.lessons.push({title:'새 수업',subject:'',activities:[]});selected=Math.min(selected,state.lessons.length-1);save();render();},'danger'));d.append(actions,el('h2','활동 순서'));if(!l.activities.length)d.append(el('p','활동을 추가해서 수업을 구성하세요.','muted'));l.activities.forEach((a,i)=>{const card=el('section',undefined,'activity');const top=el('div',undefined,'row spread'),moves=el('div',undefined,'row');const up=button('↑',()=>move(i,-1)),down=button('↓',()=>move(i,1));up.disabled=i===0;down.disabled=i===l.activities.length-1;up.setAttribute('aria-label',(i+1)+'번 활동 위로');down.setAttribute('aria-label',(i+1)+'번 활동 아래로');moves.append(up,down,button('삭제',()=>{if(confirm('이 활동을 삭제할까요?')){l.activities.splice(i,1);save();render();}},'danger'));top.append(el('h3','활동 '+(i+1)),moves);card.append(top);field(card,'활동 이름',a.title,input=>{a.title=input.value;save();});field(card,'학생에게 보여줄 안내',a.description,input=>{a.description=input.value;save();},'textarea',4000);const grid=el('div',undefined,'fields'),time=el('div'),link=el('div');const minutes=field(time,'시간 (분)',a.minutes,input=>{const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>180){input.value=a.minutes;notify('활동 시간은 1~180분의 정수로 입력해 주세요.');return;}a.minutes=n;save();},'number');minutes.min=1;minutes.max=180;field(link,'자료 링크 (선택)',a.url,input=>{const value=input.value.trim();if(!safeUrl(value)){input.value=a.url;notify('자료 링크는 http:// 또는 https://로 시작하는 웹 주소를 입력해 주세요.');return;}a.url=value;save();},'url',2000);grid.append(time,link);card.append(grid);d.append(card);});const add=button('+ 활동 추가',()=>{if(l.activities.length>=100)return notify('활동은 최대 100개입니다.');l.activities.push({title:'새 활동',description:'함께 할 활동을 안내해 주세요.',minutes:5,url:''});save();render();});add.style.marginTop='16px';d.append(add);}
function move(i,delta){const a=state.lessons[selected].activities;[a[i],a[i+delta]]=[a[i+delta],a[i]];save();render();}
function stop(){clearInterval(tick);tick=null;$('toggleTimer').textContent='타이머 시작';}
function drawTime(){$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');}
function showActivity(){stop();const l=state.lessons[selected],a=l.activities[current];$('presentLesson').textContent=l.title;$('counter').textContent=(current+1)+' / '+l.activities.length;$('presentTitle').textContent=a.title||'이름 없는 활동';$('presentDescription').textContent=a.description;$('presentLink').hidden=!a.url;if(a.url)$('presentLink').href=a.url;else $('presentLink').removeAttribute('href');remaining=a.minutes*60;drawTime();$('previous').disabled=current===0;$('next').disabled=current===l.activities.length-1;$('nextHint').textContent=current+1<l.activities.length?'다음: '+l.activities[current+1].title:'마지막 활동입니다. 오늘의 배움을 정리해 주세요.';}
function start(){if(!state.lessons[selected].activities.length)return notify('먼저 활동을 한 개 이상 추가해 주세요.');current=0;$('editor').hidden=true;$('presentation').hidden=false;showActivity();window.scrollTo(0,0);}
$('newLesson').onclick=()=>{if(state.lessons.length>=100)return notify('수업은 최대 100개입니다.');state.lessons.push({title:'새 수업',subject:'',activities:[]});selected=state.lessons.length-1;save();render();};
$('leave').onclick=()=>{stop();$('presentation').hidden=true;$('editor').hidden=false;};$('previous').onclick=()=>{if(current>0){current--;showActivity();}};$('next').onclick=()=>{if(current<state.lessons[selected].activities.length-1){current++;showActivity();}};$('resetTimer').onclick=showActivity;
$('toggleTimer').onclick=()=>{if(tick){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));stop();drawTime();return;}if(remaining===0)return;endAt=Date.now()+remaining*1000;$('toggleTimer').textContent='일시정지';tick=setInterval(()=>{remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));drawTime();if(remaining===0){stop();$('toggleTimer').textContent='시간 종료';}},200);};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;const now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');a.download=date+'-수업운영보드-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('restore').onclick=()=>$('file').click();$('file').onchange=async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>1024*1024)return notify('백업 파일은 1MB 이하여야 합니다.');try{const restored=validate(JSON.parse(await file.text()));if(!confirm('백업의 '+restored.lessons.length+'개 수업으로 현재 자료를 모두 바꿀까요? 먼저 현재 자료를 백업하는 것을 권장합니다.'))return;state=restored;selected=0;storageBlocked=false;notify('백업 자료를 불러왔습니다.');save();render();}catch(error){notify('백업을 불러오지 못했습니다. 기존 자료는 유지됩니다. '+error.message);}};
render();
</script></body></html>
