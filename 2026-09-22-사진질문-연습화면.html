<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 질문용 가상 일정</title><style>body{margin:0;background:#f7f7f0;color:#253b31;font-family:system-ui,sans-serif;line-height:1.7}main{max-width:640px;margin:36px auto;padding:24px}article{background:white;border:1px solid #cdd8ce;border-radius:20px;padding:28px}h1{font-size:28px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #ddd;padding:14px 8px}small{color:#526659}a{color:#294e40}footer{margin-top:24px}@media(max-width:480px){main{padding:16px;margin:12px auto}article{padding:18px}}</style></head><body><main><article><small>이미지 질문 연습 · 개인정보 없는 가상 자료</small><h1>함께 탐구하는 40분</h1><table><thead><tr><th>활동</th><th>할 일</th><th>시간</th></tr></thead><tbody><tr><td>도입</td><td>예상 이야기하기</td><td>5분</td></tr><tr><td>탐구</td><td>관찰하고 비교하기</td><td>25분</td></tr><tr><td>정리</td><td>발견 나누기</td><td>10분</td></tr></tbody></table><p>일정은 가상 예시입니다. 날짜와 대상 학급은 정하지 않았습니다.</p></article><footer>위 카드만 캡처해 질문하세요. 계정·알림·다른 창이 포함되지 않았는지 확인합니다.<br><a href="./2026-09-20-guide.html#/lesson/images">사진과 화면 질문 실습으로 돌아가기 →</a></footer></main></body></html>
